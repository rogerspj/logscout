# Add these location blocks to the server { } block in
# /etc/nginx/sites-available/linkscout, BEFORE the other location blocks.
#
# Also remove \.env from the existing 404 file-extension block in that file.

# ── Honeypot — fake .env ──────────────────────────────────────────────────
location ~* /\.env {
    root /var/www/honeypot;
    try_files /.env =404;
    access_log /var/log/nginx/honeypot.log honeypot;
}

location = /bandit-bmo.png {
    root /var/www/honeypot;
}
